<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Bookmark Manager</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <header class="app-header">
      <h1>🔖 Bookmark Manager</h1>
      <p>Save, organize, and categorize your favorite links in one place.</p>
    </header>

    <section class="controls">
      <input type="text" id="searchInput" placeholder="Search bookmarks..." />
      <select id="categoryFilter">
        <option value="All">All Categories</option>
      </select>
      <button id="addBtn">+ Add Bookmark</button>
    </section>

    <section id="bookmarkGrid" class="bookmark-grid">
      <!-- Bookmarks are rendered here dynamically -->
    </section>

    <p id="emptyState" class="empty-state" hidden>No bookmarks yet. Add your first one!</p>
  </div>

  <!-- Add/Edit Modal -->
  <div id="modalOverlay" class="modal-overlay" hidden>
    <div class="modal">
      <h2 id="modalTitle">Add Bookmark</h2>
      <form id="bookmarkForm">
        <input type="hidden" id="bookmarkId" />

        <label for="title">Title</label>
        <input type="text" id="title" required placeholder="e.g. MDN Web Docs" />

        <label for="url">URL</label>
        <input type="url" id="url" required placeholder="https://example.com" />

        <label for="category">Category</label>
        <input type="text" id="category" placeholder="e.g. Development" />

        <label for="description">Description</label>
        <textarea id="description" rows="3" placeholder="Optional notes..."></textarea>

        <label class="checkbox-label">
          <input type="checkbox" id="isFavorite" />
          Mark as favorite
        </label>

        <div class="modal-actions">
          <button type="button" id="cancelBtn" class="btn-secondary">Cancel</button>
          <button type="submit" class="btn-primary">Save</button>
        </div>
      </form>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
